worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        server_tokens off;

        root /usr/share/nginx/html;
        index index.html;

        # resolver do Docker + proxy_pass via variável: os backends ainda não
        # existem em todas as fases, isto evita que o nginx falhe a arrancar
        # por não conseguir resolver o upstream (só falha o pedido, em 502).
        # Nota: com proxy_pass por variável o nginx NÃO remove sozinho o
        # prefixo da location (ao contrário de proxy_pass com valor
        # estático) — daí o rewrite explícito antes do proxy_pass.
        resolver 127.0.0.11 valid=10s;

        location /api/auth/ {
            set $upstream_auth siac-auth:8080;
            rewrite ^/api/auth/(.*)$ /$1 break;
            proxy_pass http://$upstream_auth$uri$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/core/ {
            set $upstream_core siac-core:8080;
            rewrite ^/api/core/(.*)$ /$1 break;
            proxy_pass http://$upstream_core$uri$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
